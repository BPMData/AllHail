name: Check AllHail
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Google AI Studio doesn't keep package-lock.json in this repo, so `npm ci` (which needs it)
      # can't be used. Install from package.json instead, the same way OverHeard's CI does.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check native Node TypeScript support
        run: node -e "import('./server.ts').then(() => console.log('OK'))"
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
