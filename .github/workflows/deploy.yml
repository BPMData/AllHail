name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy allhail
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Install the exact versions in package-lock.json.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Unit and server tests
        run: npm test

      - name: Native Node TypeScript check
        run: node -e "import('./server.ts').then(() => console.log('OK'))"

      - name: Production smoke test
        run: npm run smoke

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Call gcloud directly: deploy-cloudrun's flag parser turns `--command=` into a bare
      # `--command`, which gcloud rejects. --command "" / --args "" clear the entrypoint
      # override left on the service from when AI Studio deployed it, so the Buildpacks launcher
      # runs `npm start` (`node server.ts`) on 3000.
      # --max-instances 1: the /api/describe rate limit (server/rateLimit.ts) is kept in memory per
      # instance, so more instances would multiply how much of the OpenRouter key one person can use.
      # No --set-env-vars / --clear-env-vars, so OPENROUTER_API_KEY and other settings stay as they are.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy allhail \
            --source . \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 1 \
            --command "" \
            --args "" \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            --quiet
