name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy allhail
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token: write lets the job ask GitHub for an OIDC token, which Google
    # trades for short-lived credentials (Workload Identity Federation). No stored key.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Install the exact versions in package-lock.json.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Unit and server tests
        run: npm test

      - name: Native Node TypeScript check
        run: node -e "import('./server.ts').then(() => console.log('OK'))"

      - name: Production smoke test
        run: npm run smoke

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/606573080592/locations/global/workloadIdentityPools/github/providers/allhail
          service_account: github-deployer@loyal-rookery-403218.iam.gserviceaccount.com

      # Stops the deploy if the credentials file from the step above would be uploaded,
      # or if package-lock.json would be missing.
      - name: Check files for upload
        run: scripts/check-upload.sh .

      - name: Record current revision
        id: prior
        run: |
          rev="$(gcloud run services describe allhail --region us-east1 --project loyal-rookery-403218 \
            --format='value(status.latestReadyRevisionName)')"
          echo "Current revision: ${rev}"
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"

      # The Buildpacks launcher runs `npm start` (`node server.ts`) on port 3000.
      # --update-env-vars NODE_ENV=production makes server.ts serve the built app. It adds or
      # replaces only NODE_ENV, so OPENROUTER_API_KEY and other plain settings on the service stay as they are.
      # --service-account: the service runs as allhail-run, which can read only AllHail's own report secrets.
      # --set-secrets: the problem-report relay's address and shared secret (docs/REPORTS.md) come from
      # Secret Manager on every deploy, so nothing is pasted into the Cloud Run console.
      # --max-instances 1: the /api/describe rate limit (server/rateLimit.ts) is kept in memory per
      # instance, so more instances would multiply how much of the OpenRouter key one person can use.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy allhail \
            --source . \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 1 \
            --service-account allhail-run@loyal-rookery-403218.iam.gserviceaccount.com \
            --update-env-vars NODE_ENV=production \
            --set-secrets REPORT_RELAY_URL=allhail-report-relay-url:latest,REPORT_RELAY_SECRET=allhail-report-relay-secret:latest \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            --quiet

      # Confirms a new revision is ready, labelled with this commit, and the live URL answers.
      - name: Check deploy
        run: scripts/check-deploy.sh "${{ steps.prior.outputs.revision }}" "${GITHUB_SHA}"
